# Prometheus scrape config for PayWatch (Phase 6, Task 2).
#
# Targets use Docker service names (api/indexer/stats), not "localhost" -
# once Prometheus itself is a container on the paywatch compose network,
# "localhost" would just be Prometheus's own container, never reaching the
# real app containers. Same class of mistake as KAFKA_BOOTSTRAP_SERVERS
# needing redpanda:9093 instead of localhost/9092 in docker-compose.aws.yml.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["api:8000"]

  - job_name: indexer
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["indexer:8001"]

  - job_name: stats
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["stats:8002"]
