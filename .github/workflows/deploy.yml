name: Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for aws-actions/configure-aws-credentials OIDC
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 producer/ consumers/ api/ shared/

  build-and-deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-deploy
          aws-region: us-east-1

      # Reuses scripts/push_images.sh as-is (Phase 4, Task 3) instead of
      # reimplementing ECR login + build + push here - it already logs in to
      # ECR, builds all 4 images from the repo root, and pushes both :latest
      # and :<short-sha> tags. One source of truth for this logic between
      # local dev and CI, not two copies that can drift.
      - name: Build and push all 4 images to ECR
        run: bash scripts/push_images.sh

      # Re-authenticates Docker to ECR on the EC2 side before pulling: the
      # instance's own ECR login (from first boot) is a token that expires
      # after 12h, so `--pull always` would fail on any deploy older than
      # that without a fresh login here.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            cd /opt/paywatch
            sudo git pull
            set -a
            source .env
            set +a
            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose -f docker-compose.aws.yml up -d --pull always

      - name: Health check
        run: |
          set -euo pipefail
          url="http://${{ vars.EC2_HOST }}:8000/health"
          # Retries for up to 30s: the containers just restarted and the API
          # needs a moment to reconnect to Postgres/Redis before /health is
          # meaningful - a single immediate curl could false-fail on that.
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "Attempt $i: GET /health -> $status"
            if [ "$status" == "200" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed (expected 200, last got $status)"
          exit 1
